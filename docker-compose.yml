services:
  db:
    image: postgres:17-alpine
    container_name: economy_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-economy}
    ports:
      # 5433 on the host so it does not clash with a local Postgres on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pipeline:
    build: .
    container_name: economy_pipeline
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the Docker network the database is "db" on the default port.
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD:-pipeline}@db:5432/${POSTGRES_DB:-economy}
    volumes:
      # Raw/clean files, logs and quality reports stay visible on the host.
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    restart: unless-stopped

volumes:
  pgdata:
