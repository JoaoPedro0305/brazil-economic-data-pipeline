name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Same ruff version as requirements-dev.txt, without installing everything else.
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: economy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d economy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://pipeline:pipeline@127.0.0.1:5432/economy_test
      REQUIRE_DB: "1"   # database tests must run here, never be skipped

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v -rs

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Also verifies the supercronic checksum pinned in the Dockerfile.
      - name: Build the pipeline image
        run: docker build -t economy-pipeline .
